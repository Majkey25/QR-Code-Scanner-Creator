# Check twice weekly in UTC, with stable times per repository, ecosystem and directory.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: cron
      cronjob: "18 1 * * 3,6"
      timezone: Etc/UTC
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: cron
      cronjob: "33 23 * * 0,4"
      timezone: Etc/UTC
