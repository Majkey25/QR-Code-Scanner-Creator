name: Temporary QR signing secret migration

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Seal existing repository secrets or verify migrated environment secrets
        required: true
        type: choice
        options: [seal, verify]
      public_key:
        description: Exact android-signing public key independently checked by the owner (seal only)
        required: false
        type: string
      key_id:
        description: Exact android-signing key ID independently checked by the owner (seal only)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: qr-signing-migration
  cancel-in-progress: false

jobs:
  seal:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'Majkey25/QR-Code-Scanner-Creator' &&
      github.repository_owner == 'Majkey25' &&
      github.actor == 'Majkey25' && github.triggering_actor == 'Majkey25' &&
      github.ref == 'refs/heads/main' && inputs.mode == 'seal'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the reviewed workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts/qr-signing-migration
      - name: Install Ubuntu libsodium Python binding before exposing secrets
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends python3-nacl
      - name: Seal the four existing values without printing them
        env:
          MIGRATION_PUBLIC_KEY: ${{ inputs.public_key }}
          MIGRATION_KEY_ID: ${{ inputs.key_id }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: /usr/bin/python3 -B .github/scripts/qr-signing-migration/seal_secrets.py --output "$RUNNER_TEMP/qr-migration-payloads"
      - name: Retain only ciphertext API payloads and public metadata for one day
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qr-signing-migration-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qr-migration-payloads/*.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false

  verify:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'Majkey25/QR-Code-Scanner-Creator' &&
      github.repository_owner == 'Majkey25' &&
      github.actor == 'Majkey25' && github.triggering_actor == 'Majkey25' &&
      github.ref == 'refs/heads/main' && inputs.mode == 'verify'
    environment: android-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the reviewed workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts/qr-signing-migration
      - name: Set up JDK 17 before exposing secrets
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Sign a dummy JAR and verify the original certificate
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.QR_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.QR_SIGNING_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.QR_SIGNING_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.QR_SIGNING_KEY_PASSWORD }}
        run: /usr/bin/python3 -B .github/scripts/qr-signing-migration/verify_signing.py
